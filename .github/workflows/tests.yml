name: tests

# Run on every push to any branch, and on every pull request.
on:
  push:
  pull_request:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch makes an older, still-running run pointless.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # a hung test must not burn runner minutes for hours
    strategy:
      fail-fast: false  # one failing combination must not hide the others
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The same combination as a Windows laptop running Python 3.14.
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip  # reuse downloaded packages between runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show installed package versions
        run: python -m pip list

      - name: Run the tests with coverage
        # Any failing test makes pytest exit non-zero, which fails this step,
        # the job, and the whole workflow. Coverage below the limit fails too.
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90